<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700"
     font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .sig    { font-family: Consolas, Menlo, 'Courier New', monospace; font-size: 13px; fill: #2b2b2b; }
      .val    { font-family: Consolas, Menlo, 'Courier New', monospace; font-size: 14px; font-weight: 700; }
      .ttl    { font-size: 15px; font-weight: 700; }
      .small  { font-size: 11.5px; fill: #555; }
      .wave   { stroke: #2b2b2b; stroke-width: 2.2; fill: none; }
      .edge   { stroke: #C0392B; stroke-width: 1.8; stroke-dasharray: 6 5; fill: none; }
    </style>
  </defs>

  <rect width="1000" height="700" fill="#ffffff"/>

  <!-- =================== PANOUL A: BINAR =================== -->
  <rect x="20" y="50" width="960" height="285" rx="10" fill="#FDF3F2" stroke="#D98B85" stroke-width="1.5"/>
  <text x="40" y="78" class="ttl" fill="#B3403A">A · POINTER BINAR: 3 → 4   (011 → 100)</text>

  <!-- fereastra în care biții comută -->
  <rect x="400" y="95" width="55" height="145" fill="#EFB4AE" opacity="0.5"/>

  <!-- frontul de eșantionare -->
  <path d="M415 90 V300" class="edge"/>
  <text x="415" y="316" text-anchor="middle" class="small" fill="#C0392B">front rd_clk (eșantionare)</text>

  <!-- semnale: sus = 1, jos = 0 -->
  <text x="150" y="122" text-anchor="end" class="sig">wptr[2]</text>
  <path d="M180 130 H400 V106 H820" class="wave"/>
  <text x="150" y="174" text-anchor="end" class="sig">wptr[1]</text>
  <path d="M180 154 H430 V178 H820" class="wave"/>
  <text x="150" y="222" text-anchor="end" class="sig">wptr[0]</text>
  <path d="M180 202 H455 V226 H820" class="wave"/>

  <!-- ce prinde eșantionarea -->
  <circle cx="415" cy="106" r="5" fill="#C0392B"/>
  <circle cx="415" cy="154" r="5" fill="#C0392B"/>
  <circle cx="415" cy="202" r="5" fill="#C0392B"/>

  <text x="290" y="256" text-anchor="middle" class="val" fill="#666">011 = 3</text>
  <text x="640" y="256" text-anchor="middle" class="val" fill="#666">100 = 4</text>
  <text x="427" y="284" text-anchor="middle" class="small">cei trei biți comută la momente ușor diferite (skew de traseu)</text>

  <rect x="840" y="112" width="130" height="86" rx="6" fill="#ffffff" stroke="#B3403A" stroke-width="2"/>
  <text x="905" y="133" text-anchor="middle" class="small">eșantionat</text>
  <text x="905" y="160" text-anchor="middle" class="val" style="font-size:18px" fill="#B3403A">1 1 1</text>
  <text x="905" y="184" text-anchor="middle" class="val" fill="#B3403A">= 7  ✗</text>
  <text x="905" y="216" text-anchor="middle" class="small">valoare care nu a</text>
  <text x="905" y="231" text-anchor="middle" class="small">existat niciodată</text>

  <!-- =================== PANOUL B: GRAY =================== -->
  <rect x="20" y="360" width="960" height="285" rx="10" fill="#EEF7F0" stroke="#7FB894" stroke-width="1.5"/>
  <text x="40" y="388" class="ttl" fill="#2F7A4D">B · POINTER GRAY: 3 → 4   (010 → 110)</text>

  <rect x="400" y="405" width="15" height="145" fill="#A9D8BA" opacity="0.7"/>

  <path d="M415 400 V610" class="edge"/>
  <text x="415" y="626" text-anchor="middle" class="small" fill="#C0392B">front rd_clk (eșantionare)</text>

  <text x="150" y="432" text-anchor="end" class="sig">wptr_gray[2]</text>
  <path d="M180 440 H400 V416 H820" class="wave"/>
  <text x="150" y="480" text-anchor="end" class="sig">wptr_gray[1]</text>
  <path d="M180 464 H820" class="wave"/>
  <text x="150" y="528" text-anchor="end" class="sig">wptr_gray[0]</text>
  <path d="M180 536 H820" class="wave"/>

  <text x="470" y="434" class="val" fill="#2F7A4D" style="font-size:16px">? singurul bit incert</text>
  <circle cx="415" cy="464" r="5" fill="#2F7A4D"/>
  <circle cx="415" cy="536" r="5" fill="#2F7A4D"/>
  <text x="470" y="482" class="small" fill="#2F7A4D">stabil, nu se schimbă</text>
  <text x="470" y="554" class="small" fill="#2F7A4D">stabil, nu se schimbă</text>

  <text x="290" y="580" text-anchor="middle" class="val" fill="#666">010 = 3</text>
  <text x="640" y="580" text-anchor="middle" class="val" fill="#666">110 = 4</text>
  <text x="407" y="600" text-anchor="middle" class="small">comută un singur bit</text>

  <rect x="840" y="422" width="130" height="106" rx="6" fill="#ffffff" stroke="#2F7A4D" stroke-width="2"/>
  <text x="905" y="443" text-anchor="middle" class="small">eșantionat</text>
  <text x="905" y="468" text-anchor="middle" class="val" fill="#2F7A4D">0 1 0 = 3 ✓</text>
  <text x="905" y="489" text-anchor="middle" class="small">sau</text>
  <text x="905" y="512" text-anchor="middle" class="val" fill="#2F7A4D">1 1 0 = 4 ✓</text>
  <text x="905" y="546" text-anchor="middle" class="small">ambele au existat</text>

  <!-- =================== CONCLUZIE =================== -->
  <text x="500" y="676" text-anchor="middle" class="small" style="font-size:13px">
    Binar: 3 biți în tranziție → 8 combinații posibile, doar 2 valide.
    Gray: 1 bit în tranziție → 2 combinații posibile, ambele valide.
  </text>
</svg>
