<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 770" width="1020" height="770"
     font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="a2s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#555"/>
    </marker>
    <style>
      .sig   { font-family: Consolas, Menlo, 'Courier New', monospace; font-size: 13px; fill: #2b2b2b; }
      .ttl   { font-size: 15px; font-weight: 700; }
      .small { font-size: 11.5px; fill: #555; }
      .wave  { stroke: #2b2b2b; stroke-width: 2.2; fill: none; }
      .meta  { stroke: #C0392B; stroke-width: 2.4; fill: none; }
      .gd    { stroke: #999; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
    </style>
  </defs>

  <rect width="1020" height="770" fill="#ffffff"/>

  <!-- ================= 1. CAZUL NORMAL ================= -->
  <rect x="20" y="46" width="980" height="230" rx="10" fill="#EEF7F0" stroke="#7FB894" stroke-width="1.5"/>
  <text x="40" y="74" class="ttl" fill="#2F7A4D">1 · NORMAL — d e stabil în jurul frontului</text>

  <text x="150" y="116" text-anchor="end" class="sig">clk</text>
  <path d="M180 120 H260 V96 H340 V120 H420 V96 H500 V120 H580 V96 H660 V120 H740" class="wave"/>

  <text x="150" y="164" text-anchor="end" class="sig">d</text>
  <path d="M180 168 H380 V144 H740" class="wave"/>

  <text x="150" y="212" text-anchor="end" class="sig">q</text>
  <path d="M180 216 H420 V192 H740" class="wave"/>

  <rect x="408" y="88" width="22" height="136" fill="#B9DCC6" opacity="0.65"/>
  <path d="M420 224 V250" class="gd"/>
  <text x="420" y="264" text-anchor="middle" class="small">fereastra setup/hold</text>

  <text x="760" y="150" class="small">d s-a schimbat cu mult înainte</text>
  <text x="760" y="166" class="small">de front: margine suficientă</text>
  <text x="760" y="198" class="small">q preia valoarea curat,</text>
  <text x="760" y="214" class="small">imediat după front</text>

  <!-- ================= 2. CAZUL CRITIC ================= -->
  <rect x="20" y="296" width="980" height="300" rx="10" fill="#FDF3F2" stroke="#D98B85" stroke-width="1.5"/>
  <text x="40" y="324" class="ttl" fill="#B3403A">2 · CRITIC — d se schimbă exact în fereastra setup/hold</text>

  <text x="150" y="368" text-anchor="end" class="sig">clk</text>
  <path d="M180 372 H260 V348 H340 V372 H420 V348 H500 V372 H580 V348 H660 V372 H740" class="wave"/>

  <text x="150" y="416" text-anchor="end" class="sig">d</text>
  <path d="M180 420 H418 V396 H740" class="wave"/>

  <rect x="408" y="340" width="22" height="212" fill="#EFB4AE" opacity="0.6"/>

  <text x="150" y="476" text-anchor="end" class="sig">meta</text>
  <text x="150" y="492" text-anchor="end" class="small">(ieșirea FF1)</text>
  <path d="M180 480 H468 V468 H740" class="gd"/>
  <path d="M180 480 H424 C436 460 444 476 452 466 C460 456 468 478 476 464 C486 454 492 470 500 456 H740" class="meta"/>

  <text x="150" y="536" text-anchor="end" class="sig">q</text>
  <text x="150" y="552" text-anchor="end" class="small">(ieșirea FF2)</text>
  <path d="M180 540 H580 V516 H740" class="wave"/>

  <!-- adnotări -->
  <path d="M424 500 H500" stroke="#C0392B" stroke-width="1" fill="none" marker-start="url(#a2s)" marker-end="url(#a2)"/>
  <text x="462" y="514" text-anchor="middle" class="small" fill="#C0392B">timp de rezolvare</text>

  <path d="M420 570 H580" stroke="#555" stroke-width="1" fill="none" marker-start="url(#a2s)" marker-end="url(#a2)"/>
  <text x="500" y="564" text-anchor="middle" class="small">o perioadă întreagă de ceas pentru stabilizare</text>

  <text x="760" y="404" class="small">fereastra setup/hold:</text>
  <text x="760" y="420" class="small">zeci de picosecunde</text>
  <text x="760" y="452" class="small" fill="#C0392B">FF1 rămâne între 0 și 1,</text>
  <text x="760" y="468" class="small" fill="#C0392B">apoi cade aleator pe una</text>
  <text x="760" y="484" class="small" fill="#C0392B">dintre valori</text>
  <text x="760" y="516" class="small">FF2 eșantionează abia la</text>
  <text x="760" y="532" class="small">frontul următor: valoare curată</text>

  <!-- ================= 3. DE CE MERGE ================= -->
  <rect x="20" y="616" width="980" height="136" rx="10" fill="#F7F7F7" stroke="#bbbbbb" stroke-width="1.5"/>
  <text x="40" y="644" class="ttl" fill="#333">De ce funcționează sincronizatorul cu 2 bistabile</text>
  <text x="40" y="670" class="small">• FF1 poate intra în metastabilitate, dar are o perioadă întreagă de ceas ca să se stabilizeze.</text>
  <text x="40" y="690" class="small">• Probabilitatea de a NU se fi stabilizat scade exponențial cu timpul disponibil: MTBF ∝ e^(t/τ), unde τ e de ordinul zecilor de picosecunde.</text>
  <text x="40" y="710" class="small">• FF2 nu corectează nimic — doar eșantionează o valoare care între timp a devenit curată, și nu propagă nedeterminarea mai departe.</text>
  <text x="40" y="730" class="small">• Valoarea finală e 0 sau 1, ambele legitime: e ori valoarea veche a bitului, ori cea nouă. Ce NU garantează: care dintre ele.</text>
</svg>
